<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch</title>
  <style>
    body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; color: #fff; font-family: sans-serif; cursor: pointer; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #overlay { position: absolute; font-size: 20px; z-index: 2; pointer-events: none; }
  </style>
</head>
<body>
  <div id="overlay">Click to unmute</div>
  <video id="vid" src="https://files.catbox.moe/p68784.mp4" autoplay playsinline muted loop></video>
  
  <script>
    const vid = document.getElementById('vid');
    const overlay = document.getElementById('overlay');
    
    document.body.addEventListener('click', () => {
      if (vid.muted) {
        vid.muted = false; // Turn on sound
        overlay.style.display = 'none'; // Hide text
      } else {
        vid.play();
      }
    });
  </script>
</body>
</html>
